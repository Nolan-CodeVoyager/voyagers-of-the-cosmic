<!DOCTYPE html>
<!-- Виджет чата — интерфейс для общения с NVIDIA Nemotron -->
<html lang="ru">
  <!-- ===========================================================================
       WIDGET.HTML — структура чат-виджета
       ===========================================================================
       РАЗДЕЛЫ:
       1) Подключения — CSS виджета и библиотеки для математики/Markdown
       2) Шапка — заголовок, выбор модели, кнопка очистки, статус онлайн
       3) Лента сообщений — контейнер для истории переписки
       4) Область ввода — предпросмотр изображений, поле текста, кнопки
       5) Модальное окно — полноэкранный просмотр прикреплённых картинок
       6) Скрипт — логика отправки и рендеринга ответов
       =========================================================================== -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voyagers of the Cosmic — чат</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@300;400;600&display=swap">
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <canvas id="starfield2" aria-hidden="true" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;"></canvas>

  <!-- РАЗДЕЛ 2: ШАПКА ВИДЖЕТА — заголовок, модель, статус, очистка -->
  <div class="chat-header">
    <div class="header-title">
      <span class="header-icon">🌌</span>
      <span>Voyagers</span>

      <select id="modelSelect" class="model-select" title="Выберите нейросеть">
        <option value="thinkingmachines/inkling" selected >inkling (новейшая модель)</option>
        <option value="nvidia/nemotron-nano-12b-v2-vl">Nemotron Nano (Фото)</option>
        <option value="nvidia/nemotron-3-ultra-550b-a55b">Nemotron 3 Ultra (для текста)</option>
        <option value="nvidia/nemotron-3.5-lightning-30b-a3b">Nemotron 3.5 Fast (для задач)</option>
        <option value="z-ai/glm-5.2">GLM 5.2 (думает до минуты)</option>
      </select>
    </div>

    <div class="header-actions">
      <button type="button" class="clear-btn" id="clearBtn" title="Очистить переписку">Очистить</button>
      <div class="status-online">
        <span class="status-dot"></span>онлайн
      </div>
    </div>
  </div>

  <!-- РАЗДЕЛ 3: ЛЕНТА СООБЩЕНИЙ — контейнер для переписки -->
  <div class="chat-messages" id="chatMessages"></div>

  <!-- РАЗДЕЛ 4: ОБЛАСТЬ ВВОДА — предпросмотр, поле текста, кнопки -->
  <div class="chat-input-area">
    <div id="imagePreviewContainer" class="image-preview-container"></div>

    <div class="input-wrapper">
      <input type="file" id="imageInput" accept="image/*" multiple style="display: none;" />
      <button type="button" class="attach-btn" id="attachBtn" title="Прикрепить изображение" disabled><img src="\img/скрепка.png" alt="скрепка" style="width:18px;height:18px;vertical-align:middle;"></button>

      <textarea
        id="userInput"
        placeholder="Введите сообщение..."
        rows="1"
        onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"
      ></textarea>

      <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Отправить">
        <svg viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- РАЗДЕЛ 5: МОДАЛЬНОЕ ОКНО — полноэкранный просмотр изображений -->
  <div id="imageModal" class="image-modal" onclick="closeImageModal()">
    <span class="image-modal-close" onclick="closeImageModal()">&times;</span>
    <img id="modalImage" class="image-modal-content" src="" alt="Увеличенное изображение" onclick="event.stopPropagation()" />
  </div>

  <!-- РАЗДЕЛ 6: СКРИПТ — логика отправки сообщений и рендеринга -->
  <script src="starfield2.js"></script>
  <script src="widget.js"></script>
</body>
</html>
